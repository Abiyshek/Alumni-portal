{% extends 'base.html' %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="auth">
  <div class="auth-head"><h1>Change password</h1></div>
  <form method="post" class="card form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="field"><span>Current password</span><input type="password" name="current_password" required autocomplete="current-password"></label>
    <label class="field"><span>New password</span><input type="password" name="new_password" required minlength="8" autocomplete="new-password"><small>At least 8 characters, with letters and numbers.</small></label>
    <label class="field"><span>Confirm new password</span><input type="password" name="confirm_password" required autocomplete="new-password"></label>
    <button class="btn lg block" type="submit">Update password</button>
  </form>
</div>
{% endblock %}

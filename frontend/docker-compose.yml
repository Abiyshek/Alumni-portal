version: '3.8'

services:
  frontend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - alumni-network

  backend:
    image: python:3.10
    working_dir: /app
    volumes:
      - ../backend:/app
    ports:
      - "5000:5000"
    command: python -m flask run --host=0.0.0.0
    environment:
      - FLASK_APP=alumni_ml_pipeline/main.py
      - FLASK_ENV=development
    networks:
      - alumni-network

networks:
  alumni-network:
    driver: bridge
